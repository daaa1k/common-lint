# tagpr merges its release PR → creates git tag + Draft GitHub Release (see .tagpr: release = draft).
# The follow-up job then pushes the image to GHCR, pins action.yml to the digest, moves the tag to
# that commit, and publishes the draft release.
#
# Git pushes (tag + default branch) use an SSH deploy key: set repository secret DEPLOY_KEY to the
# private key. Branch rules should allow the deploy key identity to bypass push restrictions.

name: tagpr

on:
  push:
    branches:
      - main

concurrency:
  group: tagpr-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tagpr:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      issues: read
      pull-requests: write
    outputs:
      tag: ${{ steps.tagpr.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: tagpr
        uses: Songmu/tagpr@d1b8138b7a31075141b6cd64103de9485ced7ac9 # v1.20.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  ghcr-digest-and-publish:
    needs: tagpr
    if: ${{ needs.tagpr.outputs.tag != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: release
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ needs.tagpr.outputs.tag }}
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image (release tag only; no latest)
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          tags: ghcr.io/daaa1k/common-lint:${{ needs.tagpr.outputs.tag }}

      - name: Commit digest-pinned action.yml, move tag, publish release
        env:
          TAG: ${{ needs.tagpr.outputs.tag }}
          DIGEST: ${{ steps.build.outputs.digest }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
        run: |
          set -euo pipefail
          [ -n "${DIGEST}" ]
          if [ -z "${DEPLOY_KEY:-}" ]; then
            echo "::error::Set repository secret DEPLOY_KEY to the SSH private key for a deploy key with write access."
            exit 1
          fi
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -t rsa,ecdsa,ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
          export GIT_SSH_COMMAND='ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes'
          draft="$(gh release view "$TAG" --json isDraft --jq '.isDraft')"
          if [ "$draft" != "true" ]; then
            echo "::error::Expected a draft GitHub Release for tag ${TAG} (created by tagpr)."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          sed -i -E 's|^[[:space:]]*image:[[:space:]].*|  image: docker://ghcr.io/daaa1k/common-lint@'"${DIGEST}"'|' action.yml
          git add action.yml
          if git diff --staged --quiet; then
            echo "::error::action.yml did not change after digest substitution (unexpected)."
            exit 1
          fi
          git commit -m "chore: pin container image to GHCR digest (${TAG}) [skip ci]"
          git remote set-url origin "git@github.com:${GITHUB_REPOSITORY}.git"
          # Detached HEAD has the digest commit; local refs/tags/<TAG> still points at the pre-commit
          # tag target, so `git push origin <TAG>` would not move the remote tag. Push HEAD explicitly.
          git push origin "HEAD:refs/tags/${TAG}" --force
          if git push origin "HEAD:${DEFAULT_BRANCH}"; then
            echo "Pushed digest commit to ${DEFAULT_BRANCH}."
          else
            echo "::warning::Could not fast-forward ${DEFAULT_BRANCH}; tag ${TAG} was updated. Merge or cherry-pick the digest commit manually if needed."
          fi
          gh release edit "${TAG}" --draft=false
